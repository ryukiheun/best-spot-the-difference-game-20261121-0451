<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit Lantern Market — Spot the Difference</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #14101f; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; color: #fff3d6; }
  header { display: flex; align-items: center; gap: 18px; padding: 8px 16px; background: #241d33; }
  header h1 { font-size: 20px; margin: 0; white-space: nowrap; }
  #score-line { font-size: 15px; white-space: nowrap; }
  #timer-wrap { flex: 1; height: 18px; background: #3a2f52; border-radius: 9px; overflow: hidden; }
  #timer-fill { height: 100%; width: 100%; background: #e8b23a; }
  #timer-text { font-size: 18px; font-weight: bold; min-width: 52px; text-align: right; }
  #left-line { font-size: 20px; font-weight: bold; color: #ffd700; min-width: 64px; text-align: right; }
  #stage { flex: 1; min-height: 0; display: flex; }
  canvas { width: 100%; height: 100%; display: block; }
  footer { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #241d33; }
  footer button { font-size: 15px; padding: 6px 14px; border-radius: 8px; border: 1px solid #e8b23a; background: #3a2f52; color: #fff3d6; cursor: pointer; }
  footer button:disabled { opacity: 0.45; cursor: default; }
  #status { font-size: 14px; color: #ffe9a8; }
</style>
</head>
<body>
<header>
  <h1>Moonlit Lantern Market</h1>
  <span id="score-line">Score 0 · Best 0 · Cat Café at Dusk</span>
  <div id="timer-wrap"><div id="timer-fill"></div></div>
  <span id="timer-text">03:00</span>
  <span id="left-line">7 left</span>
</header>
<div id="stage"><canvas id="game" width="1280" height="640"></canvas></div>
<footer>
  <button id="hint-btn" type="button">Hint (H) — 3 left</button>
  <button id="pause-btn" type="button">Pause (P)</button>
  <button id="mute-btn" type="button">Mute (M)</button>
  <button id="restart-btn" type="button">Restart (R)</button>
  <span id="status" aria-live="polite">Moonlit Lantern Market. Press Enter or click to play.</span>
</footer>
<script type="module" src="./src/main.js"></script>
</body>
</html>
